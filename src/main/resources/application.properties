server.port=8080
# Database: a file inside the project folder "data/". No installation needed.
spring.datasource.url=jdbc:h2:file:./data/hrgenius
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=always

# --- To use MySQL instead: create a database named hrgenius, delete the 4 datasource lines above,
# --- add the mysql-connector-j dependency in pom.xml, and uncomment these:
# spring.datasource.url=jdbc:mysql://localhost:3306/hrgenius
# spring.datasource.username=root
# spring.datasource.password=your_password
